<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림 라이어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --ink: #2f2a4a; --muted: #8b84a3; --paper: #ffffff; --bg: #e9e4ff; --line: #e3dcf5;
    --yellow: #ffd84d; --yellow-soft: #fff4c2; --pink: #ff9ec4; --pink-soft: #ffe3ef; --mint: #8fe3c8; --mint-soft: #ddf8ee;
    --sky: #9cc9ff; --sky-soft: #e3f0ff; --lav: #c4b2ff; --lav-soft: #efe9ff;
    --accent: #7b61ff; --good: #22b573; --bad: #ff5c7a; --warn: #ffa63d;
    --radius: 22px; --pop: 4px 4px 0 var(--ink);
    --display: "Jua", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--ink); background-color: var(--bg);
    background-image: radial-gradient(#d3c9fb 1.6px, transparent 1.8px); background-size: 24px 24px;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; }
  .hidden { display: none !important; }
  .off { visibility: hidden; }
  button { font: inherit; color: var(--ink); cursor: pointer; background: var(--paper); border: 3px solid var(--ink);
    border-radius: 16px; padding: 8px 16px; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s, background .15s; }
  button:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--yellow); font-family: var(--display); font-size: 19px; }
  input, select { font: inherit; color: var(--ink); padding: 11px 14px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; outline: none; }
  input:focus, select:focus { background: var(--yellow-soft); }
  .card { background: var(--paper); border: 3px solid var(--ink); border-radius: var(--radius); box-shadow: var(--pop); }
  .banner { background: var(--yellow-soft); border-bottom: 3px solid var(--ink); padding: 6px 16px; font-size: 13px; text-align: center; }

  /* 입장 */
  #join { max-width: 440px; margin: 48px auto; padding: 30px 30px 28px; position: relative; }
  #join .logo { text-align: center; font-size: 46px; line-height: 1; }
  #join h1 { font-size: 46px; text-align: center; margin-top: 6px; letter-spacing: 1px; }
  #join h1 span { display: inline-block; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
  #join h1 span:nth-child(odd) { transform: rotate(-4deg); } #join h1 span:nth-child(even) { transform: rotate(4deg) translateY(2px); }
  #join .sub { color: var(--muted); margin: 10px 0 20px; text-align: center; font-size: 15px; }
  #join .sub.err { color: var(--bad); font-weight: 700; }
  #join label { display: block; font-family: var(--display); font-size: 17px; margin: 14px 0 6px; }
  #join input { width: 100%; }
  #join .joinhelp { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
  #join .specrow { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  #join .specrow input { width: 20px; height: 20px; padding: 0; accent-color: var(--accent); }
  #join .row { display: flex; gap: 12px; margin-top: 24px; }
  #join .row > * { flex: 1; padding: 12px; font-family: var(--display); font-size: 20px; }

  /* 게임 */
  #game { max-width: 1280px; margin: 0 auto; padding: 16px 16px 28px; }
  .topbar { display: grid; grid-template-columns: 230px 1fr 230px; gap: 12px; align-items: center; padding: 12px 18px; }
  .roombox { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .roomchip { font-family: var(--display); font-size: 20px; background: var(--lav-soft); border: 3px solid var(--ink); padding: 4px 14px; border-radius: 999px; }
  .copy { font-size: 13px; padding: 5px 12px; box-shadow: 2px 2px 0 var(--ink); }
  .center { text-align: center; min-width: 0; display: grid; grid-template-rows: 28px 12px 28px 28px 46px; align-items: center; justify-items: center; }
  .qinfo { font-family: var(--display); font-size: 19px; color: var(--muted); }
  .qinfo b { color: var(--ink); font-weight: 400; font-size: 24px; }
  .progress { display: flex; gap: 3px; justify-content: center; width: min(100%, 440px); }
  .progress i { flex: 1 1 0; max-width: 16px; min-width: 3px; height: 9px; border-radius: 5px; background: #ece6fa; border: 2px solid #ddd3f3; }
  .progress i.done { background: var(--accent); border-color: var(--ink); }
  .progress i.now { background: var(--yellow); border-color: var(--ink); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .status { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .status .who { background: var(--yellow); border: 2px solid var(--ink); padding: 1px 10px; border-radius: 999px; font-weight: 800; }
  .cattag { display: inline-block; font-size: 13px; background: var(--sky-soft); border: 2px solid var(--ink); padding: 1px 10px; border-radius: 999px; font-weight: 700; }
  .hint { display: flex; gap: 6px; justify-content: center; flex-wrap: nowrap; align-items: center; }
  .rolebox { font-family: var(--display); font-size: 19px; padding: 4px 16px; border: 3px solid var(--ink); border-radius: 14px; background: var(--mint-soft); box-shadow: 2px 2px 0 var(--ink); }
  .rolebox b { font-weight: 400; font-size: 24px; color: var(--accent); }
  .rolebox.liar { background: var(--pink-soft); }
  .rolebox.watch { background: #f4f1fb; color: var(--muted); }
  .hint span.ch { width: 34px; height: 40px; border-radius: 10px; background: var(--mint-soft); border: 3px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
    display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 22px; animation: flip .4s both; }
  @keyframes flip { from { transform: rotateX(90deg); } }

  .timerwrap { display: flex; justify-content: flex-end; }
  .timer { position: relative; width: 80px; height: 80px; }
  .timer svg { transform: rotate(-90deg); }
  .timer .track { stroke: #efe9fa; }
  .timer .bar { stroke: var(--good); transition: stroke-dashoffset .25s linear, stroke .3s; }
  .timer .face { position: absolute; inset: 9px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
  .timer .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 26px; }
  .timer.mid .bar { stroke: var(--warn); }
  .timer.low .bar { stroke: var(--bad); }
  .timer.low .num { color: var(--bad); animation: pulse 1s infinite; }
  .timer.crit { animation: shake .4s infinite; }
  @keyframes pulse { 50% { transform: scale(1.25); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px) rotate(-3deg); } 75% { transform: translateX(3px) rotate(3deg); } }

  .layout { display: grid; grid-template-columns: 250px 1fr 300px; gap: 16px; margin-top: 16px; align-items: start; }
  .panel-title { font-family: var(--display); font-size: 19px; padding: 14px 16px 8px; }

  #players { list-style: none; margin: 0; padding: 4px 10px 12px; }
  #players li { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 16px; margin-bottom: 7px; border: 2px solid transparent; position: relative; background: #f7f4fd; }
  #players li.me { border-color: var(--line); }
  #players li.drawer { background: var(--yellow-soft); border: 2px solid var(--ink); }
  #players li.liar { background: var(--pink-soft); border: 2px solid var(--ink); }
  #players li.out { opacity: .55; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 21px; flex: none; border: 2px solid var(--ink); }
  .cdot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
  .pinfo { flex: 1; min-width: 0; }
  .pname { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .tags { display: flex; gap: 3px; margin-top: 2px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 0 7px; border-radius: 999px; background: #ebe5f7; color: var(--muted); font-weight: 800; }
  .tag.t-draw { background: var(--yellow); color: var(--ink); }
  .tag.t-liar { background: var(--pink); color: var(--ink); }
  .tag.t-ok { background: var(--good); color: #fff; }
  .tag.t-host { background: var(--lav); color: var(--ink); }
  .pscore { font-family: var(--display); font-size: 21px; }
  .rk { width: 24px; text-align: center; font-family: var(--display); font-size: 17px; color: var(--muted); flex: none; }
  .rk.top { font-size: 21px; }
  .pop { position: absolute; right: 8px; top: -12px; font-family: var(--display); color: #fff; background: var(--good); border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; font-size: 17px; animation: popup 1.6s forwards; pointer-events: none; }
  @keyframes popup { 0% { opacity: 0; transform: translateY(10px) scale(.6); } 20% { opacity: 1; transform: translateY(0) scale(1.2); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }

  .stagecard { padding: 12px; }
  canvas#board { display: block; width: 100%; aspect-ratio: 4 / 3; background: #fff; border-radius: 16px; border: 4px solid var(--line); touch-action: none; }
  canvas#board.can { cursor: crosshair; }
  .action { margin-top: 12px; padding: 12px 14px; background: #faf8ff; border: 3px dashed #d9cff5; border-radius: 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .action p { margin: 0; }
  .action .big { font-family: var(--display); font-size: 21px; }
  .action .mut { color: var(--muted); font-size: 13px; }
  .orderbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .oc { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 800; padding: 2px 10px 2px 6px; border-radius: 999px; background: #fff; border: 2px solid var(--line); }
  .oc.now { border-color: var(--ink); background: var(--yellow); }
  .oc.done { opacity: .5; }
  .votes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .votebtn { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; padding: 6px 14px 6px 8px; }
  .votebtn.on { background: var(--pink); }
  .guessrow { display: flex; gap: 8px; width: 100%; max-width: 380px; }
  .guessrow input { flex: 1; min-width: 0; }
  .result-word { font-family: var(--display); font-size: 44px; color: var(--accent); -webkit-text-stroke: 1px var(--ink); line-height: 1.1; }
  .outcome { font-family: var(--display); font-size: 21px; padding: 8px 16px; border: 3px solid var(--ink); border-radius: 16px; box-shadow: var(--pop); background: var(--mint-soft); }
  .outcome.liarwin { background: var(--pink-soft); }
  .votelist { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .votelist li { font-size: 13px; font-weight: 700; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .votelist li.hit { border-color: var(--ink); background: var(--yellow-soft); }
  .ptsrow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .ptsrow span { font-family: var(--display); font-size: 16px; color: #fff; background: var(--good); border: 2px solid var(--ink); border-radius: 999px; padding: 0 10px; }
  .nextbar { width: 220px; height: 12px; background: #ece6fa; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .nextbar i { display: block; height: 100%; background: var(--accent); animation: fill linear forwards; }
  @keyframes fill { from { width: 0; } to { width: 100%; } }

  /* 대기실 */
  .lobby { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 18px 8px 10px; text-align: center; }
  .lobby h2 { font-size: 32px; }
  .lobby .sub { color: var(--muted); margin: -8px 0 0; font-size: 14px; }
  .lobbyplayers { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .lobbyplayers .lp { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; font-size: 13px; font-weight: 800; animation: bounce .4s; }
  .lobbyplayers .lp span:last-child { max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lobbyplayers .avatar { width: 56px; height: 56px; font-size: 30px; border-width: 3px; }
  .lobbyplayers .empty { width: 56px; height: 56px; border-radius: 50%; border: 3px dashed #d8cfef; display: flex; align-items: center; justify-content: center; color: #cfc5e8; font-size: 22px; }
  @keyframes bounce { 0% { transform: scale(.5); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .setbox { width: 100%; max-width: 580px; background: #faf8ff; border: 3px solid var(--ink); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .setrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; font-weight: 700; }
  .setrow .lbl { font-family: var(--display); font-size: 17px; font-weight: 400; }
  .setrow select { padding: 6px 10px; }
  .pill { display: inline-block; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; font-weight: 800; }
  .catlist { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .catchip { font-size: 15px; padding: 6px 14px; border-radius: 999px; box-shadow: 2px 2px 0 var(--ink); background: #fff; }
  .catchip.on { background: var(--pink); }
  .catlist .catchip:disabled { opacity: 1; cursor: default; }
  .rules { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 560px; text-align: left; background: var(--yellow-soft); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 14px; }
  #startBtn { font-size: 22px; padding: 12px 40px; }

  /* 채팅 */
  .chatbox { display: flex; flex-direction: column; height: calc(100vh - 250px); min-height: 440px; max-height: 720px; overflow: hidden; }
  #log { flex: 1; overflow-y: auto; padding: 4px 12px 10px; font-size: 14px; }
  #log .m { margin: 6px 0; line-height: 1.45; word-break: break-all; background: #f5f1ff; border-radius: 14px 14px 14px 4px; padding: 6px 10px; width: fit-content; max-width: 100%; }
  #log .m .n { font-weight: 800; margin-right: 6px; }
  #log .sys { color: var(--muted); font-size: 12px; text-align: center; margin: 8px 0; }
  #log .ok { background: var(--mint-soft); border: 2px solid var(--ink); font-weight: 800; padding: 6px 10px; border-radius: 12px; text-align: center; margin: 8px 0; }
  #log .info { background: var(--yellow-soft); border: 2px solid var(--ink); font-weight: 800; padding: 6px 10px; border-radius: 12px; text-align: center; margin: 8px 0; }
  .chatform { display: flex; gap: 8px; padding: 10px; border-top: 3px solid var(--ink); background: #faf8ff; }
  .chatform input { flex: 1; min-width: 0; padding: 9px 12px; }
  .chatform button { padding: 8px 14px; font-size: 17px; }
  .chathint { font-size: 12px; color: var(--muted); padding: 0 12px 8px; background: #faf8ff; min-height: 8px; }

  /* 최종 결과 */
  #result { position: fixed; inset: 0; background: rgba(47, 42, 74, .45); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  #result .box { width: min(640px, 100%); padding: 26px 24px; text-align: center; max-height: 92vh; overflow-y: auto; }
  #result h2 { font-size: 40px; }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 12px; margin: 22px 0 16px; }
  .pod { display: flex; flex-direction: column; align-items: center; width: 150px; }
  .pod .avatar { width: 60px; height: 60px; font-size: 32px; margin-bottom: 6px; border-width: 3px; }
  .pod .pn { font-weight: 800; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pod .ps { font-family: var(--display); font-size: 22px; margin-bottom: 6px; }
  .pod .block { width: 100%; border: 3px solid var(--ink); border-bottom: 0; border-radius: 16px 16px 0 0; display: flex; justify-content: center; padding-top: 10px; font-size: 40px; animation: rise .7s ease-out both; }
  .pod.p1 .block { height: 150px; background: var(--yellow); }
  .pod.p2 .block { height: 110px; background: var(--sky); animation-delay: .15s; }
  .pod.p3 .block { height: 80px; background: var(--pink); animation-delay: .3s; }
  .pod.p1 .avatar { width: 74px; height: 74px; font-size: 40px; }
  .podium-base { height: 10px; background: var(--ink); border-radius: 6px; margin: -16px auto 18px; max-width: 480px; }
  @keyframes rise { from { transform: scaleY(0); transform-origin: bottom; } to { transform: scaleY(1); transform-origin: bottom; } }
  .restlist { list-style: none; padding: 0; margin: 0 auto 18px; max-width: 360px; text-align: left; }
  .restlist li { display: flex; justify-content: space-between; padding: 8px 14px; border-radius: 12px; background: #f8f5fe; border: 2px solid var(--line); margin-bottom: 6px; font-weight: 800; }
  .choices { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  @media (max-width: 1060px) {
    .layout { grid-template-columns: 1fr; }
    #players { display: flex; flex-wrap: wrap; gap: 6px; }
    #players li { margin: 0; }
    .chatbox { height: 340px; min-height: 0; }
    .topbar { grid-template-columns: 1fr auto; }
    .roombox { grid-column: 1 / -1; flex-direction: row; }
    .center { grid-column: 1; }
  }
</style>
</head>
<body>
<div id="modeBanner" class="banner hidden"></div>
<canvas id="confetti"></canvas>

<!-- 1) 입장 -->
<section id="join" class="card">
  <div class="logo">🕵️</div>
  <h1><span style="color:#ff9ec4">그</span><span style="color:#ffd84d">림</span> <span style="color:#8fe3c8">라</span><span style="color:#9cc9ff">이</span><span style="color:#c4b2ff">어</span></h1>
  <p class="sub">모두 한 획씩 이어 그려요. 제시어를 모르는 라이어를 찾아내요!</p>
  <label for="nameInput">닉네임</label>
  <input id="nameInput" maxlength="10" placeholder="예: 세훈">
  <label for="roomInput">방 번호 (영어·숫자 2~12자)</label>
  <input id="roomInput" maxlength="12" placeholder="예: 1234, sehun, ROOM7">
  <label class="specrow" for="specInput"><input type="checkbox" id="specInput"> 👀 관전만 하기 (게임에는 참가 안 해요)</label>
  <p class="joinhelp">만들 때는 원하는 번호를 정하고, 들어갈 때는 친구가 알려준 번호를 넣어요.<br>비워 두고 방 만들기를 누르면 번호가 자동으로 정해져요. (3~15명)<br>이미 진행 중인 방에 들어가면 이번 라운드는 구경만 하고, 다음 라운드부터 참가해요.</p>
  <div class="row">
    <button id="createBtn" class="primary">방 만들기</button>
    <button id="enterBtn">입장하기</button>
  </div>
</section>

<!-- 2) 게임 -->
<section id="game" class="hidden">
  <div class="topbar card">
    <div class="roombox">
      <span class="roomchip">방 <span id="roomCode"></span></span>
      <button id="copyBtn" class="copy">🔗 초대 링크 복사</button>
    </div>
    <div class="center">
      <div id="qinfo" class="qinfo"></div>
      <div id="progress" class="progress"></div>
      <div id="status" class="status"></div>
      <div id="catInfo"></div>
      <div id="hint" class="hint"></div>
    </div>
    <div class="timerwrap"><div id="timer" class="timer off">
      <svg width="80" height="80"><circle class="track" cx="40" cy="40" r="34" fill="none" stroke-width="9"/>
        <circle id="timerBar" class="bar" cx="40" cy="40" r="34" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="0"/></svg>
      <div class="face"></div><div id="timerNum" class="num"></div>
    </div></div>
  </div>
  <div class="layout">
    <div class="card">
      <div class="panel-title">🏆 순위표</div>
      <ul id="players"></ul>
    </div>
    <div class="card stagecard">
      <div id="lobbyPanel" class="lobby hidden"></div>
      <div id="stage">
        <canvas id="board" width="800" height="600"></canvas>
        <div id="action" class="action"></div>
      </div>
    </div>
    <div class="card chatbox">
      <div class="panel-title">💬 채팅 · 토론</div>
      <div id="log"></div>
      <form id="chatForm" class="chatform">
        <input id="chatInput" maxlength="40" autocomplete="off" placeholder="채팅 입력">
        <button class="primary">보내기</button>
      </form>
      <div id="chatHint" class="chathint"></div>
    </div>
  </div>

// ===================== 통신 (Supabase 또는 테스트 모드) =====================
function makeSupabaseNet(room) {

  const ch = client.channel("liar-" + room, { config: { broadcast: { self: false }, presence: { key: myId } } });
  const api = { msgFn: null, presFn: null };
  ch.on("broadcast", { event: "m" }, ({ payload }) => api.msgFn && api.msgFn(payload));
  ch.on("presence", { event: "sync" }, () => {
    const st = ch.presenceState(), list = {};
    for (const id in st) { const p = st[id][0]; if (p) list[id] = { name: p.name, joinedAt: p.joinedAt, spec: !!p.spec }; }
    api.presFn && api.presFn(list);
  });
  ch.subscribe(async (status) => {
    if (status === "SUBSCRIBED") { await ch.track({ name: myName, joinedAt, spec: mySpec }); api.ready && api.ready(); }
    if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") sysMsg("서버 연결 문제가 생겼어요. 새로고침해 보세요.");
  });
  api.send = (msg) => { if (!api.closed) ch.send({ type: "broadcast", event: "m", payload: msg }); };
  api.leave = () => { api.closed = true; api.msgFn = api.presFn = api.ready = null; ch.untrack().catch(() => {}); client.removeChannel(ch); };
  return api;
}
function makeLocalNet(room) {

  const emitPres = () => {
    const now = Date.now(), list = { [myId]: { name: myName, joinedAt, spec: mySpec } };
    for (const id in seen) if (now - seen[id].t < 5000) list[id] = seen[id].p; else delete seen[id];
    api.presFn && api.presFn(list);
  };
  bc.onmessage = (e) => {
    const m = e.data;
    if (m.__ping) { const isNew = !seen[m.p.id]; seen[m.p.id] = { p: { name: m.p.name, joinedAt: m.p.joinedAt, spec: !!m.p.spec }, t: Date.now() }; if (isNew) { bc.postMessage({ __ping: 1, p: me() }); emitPres(); } return; }
    if (m.__bye) { delete seen[m.id]; emitPres(); return; }
    api.msgFn && api.msgFn(m);
  };
  const iv = setInterval(() => { bc.postMessage({ __ping: 1, p: me() }); emitPres(); }, 1500);
  const bye = () => bc.postMessage({ __bye: 1, id: myId });
  addEventListener("beforeunload", bye);
  setTimeout(() => { if (api.closed) return; bc.postMessage({ __ping: 1, p: me() }); emitPres(); api.ready && api.ready(); }, 50);
  api.send = (msg) => { if (!api.closed) bc.postMessage(msg); };
  api.leave = () => { api.closed = true; api.msgFn = api.presFn = api.ready = null; clearInterval(iv); bye(); removeEventListener("beforeunload", bye); bc.close(); };

}
// emit = 모두에게 보내고 나도 처리 / net.send = 남에게만

const params = new URLSearchParams(location.search);

let joinMode = "join";
function enter(code, mode) {

  if (!/^[A-Z0-9]{2,12}$/.test(code)) { alertBox("방 번호는 영어나 숫자로 2~12자예요 (띄어쓰기·특수문자 X)"); return; }

  if (mySpec && mode === "create") { alertBox("관전만 하려면 '입장하기'로 친구의 방에 들어가 주세요"); return; }
  joinMode = mode; joinedAt = Date.now();
  try { localStorage.setItem("drawName", myName); } catch (e) {}

  $("roomCode").textContent = code;

      if (dupName) { leaveRoom(`'${myName}' 닉네임은 이 방에 이미 있어요. 다른 닉네임으로 들어와 주세요.`); return; }
      if (joinMode === "create" && presentIds().length > 1 && presentIds()[0] !== myId) { leaveRoom(`'${code}' 방은 이미 누가 쓰고 있어요. 다른 번호로 만들거나 '입장하기'를 눌러 주세요.`); return; }
      if (!mySpec && playerIds().indexOf(myId) >= MAX_PLAYERS) { leaveRoom(`참가 인원이 가득 찼어요 (최대 ${MAX_PLAYERS}명). '관전만 하기'로는 들어올 수 있어요.`); return; }
      if (joinMode === "join" && presentIds().length === 1) sysMsg("아직 이 방에 아무도 없어요. 방 번호가 맞는지 확인해 보세요. (내가 방장이 돼요)");

  };

}
function leaveRoom(msg) {

  $("log").innerHTML = ""; $("result").classList.add("hidden");
  $("game").classList.add("hidden"); $("join").classList.remove("hidden");

function alertBox(t) { const p = $("join").querySelector(".sub"); p.textContent = "⚠️ " + t; p.classList.add("err"); }
$("createBtn").onclick = () => enter($("roomInput").value, "create");
$("enterBtn").onclick = () => enter($("roomInput").value, "join");

// ===================== 접속자 / 방장 =====================
function onPresence(list) {
  const before = Object.keys(present).sort().join();
  const prevPresent = present;
  present = list;
  for (const id in prevPresent) if (!present[id] && settled) sysMsg(`${prevPresent[id].name}님이 나갔어요.`);
  for (const id in present) if (!prevPresent[id] && id !== myId && settled) sysMsg(`${present[id].name}님이 ${present[id].spec ? "관전자로 " : ""}들어왔어요.`);
  const ids = presentIds(), wasHost = isHost;
  isHost = settled && hostIdNow() === myId;
  if (isHost) {
    if (!S) S = newLobby();
    for (const id of ids) { S.names[id] = present[id].name; if (!present[id].spec && !(id in S.scores)) S.scores[id] = 0; }
    if (!wasHost) { sysMsg("👑 내가 방장이 됐어요."); hostEnds = localEnds || Date.now(); }
    if (before !== Object.keys(present).sort().join() || !wasHost) pushState();
  }
  render();
}
function newLobby() {
  return { phase: "lobby", names: {}, scores: {}, totalRounds: 5, laps: 2, turnSec: 20, voteSec: 60, round: 0, qid: 0,
    order: [], colors: {}, cur: null, turn: 0, totalTurns: 0, voted: {}, liarId: null, caught: null, guessed: null, guessText: null,
    votesView: null, word: null, cat: null, pts: {}, why: "", liarCount: {}, lastLiar: null, cats: [...CAT_KEYS],
    timerTotal: 0, endsIn: 0, endReason: null };
}
function presentIds() { return Object.keys(present).sort((a, b) => present[a].joinedAt - present[b].joinedAt || (a < b ? -1 : 1)); }
// 관전자는 게임 참가자(플레이어)에서 빠져요. 방장도 참가자 중에서 정해요 (참가자가 없을 때만 관전자가 임시 방장)
function playerIds() { return presentIds().filter((id) => !present[id].spec); }
function hostIdNow() { return playerIds()[0] || presentIds()[0]; }

// ===================== 방장 전용: 게임 진행 =====================
// 제시어·라이어·투표 내용은 "방장 컴퓨터 안에서만" 들고 있고, 모두에게 뿌리는 state에는 넣지 않아요.
let hostEnds = 0, hostQid = -1, hostWord = null, hostLiar = null, hostVotes = {}, hostGuessed = false, hostUsed = [], strokeLog = [];
function setTimer(ms) { hostEnds = Date.now() + ms; S.timerTotal = ms; }
function pushState() {
  if (!isHost) return;
  S.endsIn = Math.max(0, hostEnds - Date.now());
  emit({ t: "state", s: JSON.parse(JSON.stringify(S)) });
}
function logStroke(m) { strokeLog.push({ c: m.c, w: m.w, pts: m.pts }); if (strokeLog.length > 800) strokeLog.shift(); }
function sendRole(id) {   // 그 사람에게만 보내는 비밀 (라이어는 제시어 대신 X)
  const msg = { t: "role", to: id, qid: S.qid, x: id === hostLiar, word: id === hostLiar ? null : hostWord };
  if (id === myId) handle(msg); else net.send(msg);
}
function pickWord() {
  const cats = (S.cats && S.cats.length ? S.cats : CAT_KEYS).filter((k) => CATS[k]);
  const all = [], seen = new Set();
  for (const k of cats) for (const w of CATS[k].words) if (!seen.has(w)) { seen.add(w); all.push({ w, cat: k }); }
  let pool = all.filter((x) => !hostUsed.includes(x.w) && !seenWords.includes(x.w));
  if (!pool.length) pool = all.filter((x) => !hostUsed.includes(x.w));
  if (!pool.length) pool = all;
  return pool[Math.floor(Math.random() * pool.length)];
}
function pickLiar(order) {   // 라이어를 덜 해본 사람 우선, 직전 라이어는 가능하면 제외
  let cand = order.filter((id) => id !== S.lastLiar);
  if (!cand.length) cand = order;
  const cnt = (id) => S.liarCount[id] || 0, min = Math.min(...cand.map(cnt));
  const pool = cand.filter((id) => cnt(id) === min);
  return pool[Math.floor(Math.random() * pool.length)];
}
function startGame() {
  const ids = playerIds();
  if (ids.length < MIN_PLAYERS) { sysMsg(`${MIN_PLAYERS}명 이상 있어야 시작할 수 있어요.`); return; }
  S.scores = {}; const names = {};
  for (const id of ids) { S.scores[id] = 0; names[id] = present[id].name; }
  S.names = names; S.round = 0; S.liarCount = {}; S.lastLiar = null; hostUsed = [];
  if (!S.cats || !S.cats.length) S.cats = [...CAT_KEYS];

}
// redo=true: 라운드 번호는 그대로 두고 다시 시작 (라이어가 나갔을 때 등)
function startRound(redo) {
  const ids = playerIds().slice(0, MAX_PLAYERS);
  if (ids.length < MIN_PLAYERS) { finishGame(`인원이 ${MIN_PLAYERS}명보다 적어져서 게임을 마쳤어요.`); return; }
  if (!redo) S.round++;

  S.qid++; hostQid = S.qid;
  const order = shuffle(ids.slice());
  S.order = order; S.colors = {}; order.forEach((id, i) => { S.colors[id] = PALETTE[i % PALETTE.length]; S.names[id] = present[id].name; if (!(id in S.scores)) S.scores[id] = 0; });
  hostLiar = pickLiar(order); S.liarCount[hostLiar] = (S.liarCount[hostLiar] || 0) + 1;
  const w = pickWord(); hostWord = w.w; hostUsed.push(w.w); S.cat = w.cat;
  hostVotes = {}; hostGuessed = false; strokeLog = [];
  Object.assign(S, { word: null, liarId: null, caught: null, guessed: null, guessText: null, votesView: null, voted: {}, pts: {}, why: "", endReason: null });
  S.turn = 0; S.totalTurns = order.length * S.laps; S.cur = order[0]; S.phase = "drawing";
  setTimer(S.turnSec * 1000); pushState();

}
function advanceTurn() {
  S.turn++;

  S.cur = S.order[S.turn % S.order.length];
  setTimer(S.turnSec * 1000); pushState();
}
function toVoting() {
  S.phase = "voting"; S.cur = null; S.voted = {}; hostVotes = {};
  setTimer(S.voteSec * 1000); pushState();
}
function tally() {
  const counts = {};
  for (const v of Object.values(hostVotes)) counts[v] = (counts[v] || 0) + 1;
  const max = Math.max(0, ...Object.values(counts));
  const top = Object.keys(counts).filter((id) => counts[id] === max);
  S.votesView = { ...hostVotes };
  S.caught = max > 0 && top.length === 1 && top[0] === hostLiar;
  S.why = max === 0 ? "아무도 투표하지 않았어요" : top.length > 1 ? "동점이라 지목에 실패했어요" : top[0] !== hostLiar ? `엉뚱한 사람(${nameOf(top[0])})이 지목됐어요` : "";

// 점수: 못 잡힘 → 라이어 +3 / 잡혔지만 제시어 맞힘 → 라이어 +2 / 잡히고 못 맞힘 → 시민 +1 (라이어를 찍었으면 +2)

  else if (guessedRight) pts[hostLiar] = 2;
  else for (const id of S.order) if (id !== hostLiar) pts[id] = 1 + (hostVotes[id] === hostLiar ? 1 : 0);
  for (const id in pts) S.scores[id] = (S.scores[id] || 0) + pts[id];

function cancelRound(msg) { emit({ t: "sys", text: msg }); startRound(true); }
setInterval(() => {
  if (!isHost || !S) return;
  const left = hostEnds - Date.now(), ph = S.phase;
  if (PLAYING.includes(ph) && playerIds().length < MIN_PLAYERS) { finishGame(`인원이 ${MIN_PLAYERS}명보다 적어져서 게임을 마쳤어요.`); return; }
  if (["drawing", "voting", "guess"].includes(ph)) {
    if (hostQid !== S.qid) { cancelRound("방장이 바뀌어서 이번 라운드를 다시 시작해요."); return; }
    if (!present[hostLiar]) { cancelRound("라이어가 나가서 이번 라운드를 다시 시작해요."); return; }
  }
  if (ph === "drawing") { if (!present[S.cur] || left <= 0) advanceTurn(); }
  else if (ph === "voting") { const act = S.order.filter((id) => present[id]); if (left <= 0 || act.every((id) => S.voted[id])) tally(); }
  else if (ph === "guess") { if (left <= 0) finishRound(false); }
  else if (ph === "result" && left <= 0) startRound(false);

// ===================== 메시지 처리 =====================
function handle(m) {
  switch (m.t) {
    case "hello": if (isHost && S) pushState(); break;
    case "state": { const prev = S; S = m.s; localEnds = Date.now() + S.endsIn; onStateChange(prev, S); render(); break; }
    case "sys": sysMsg(m.text); break;
    case "role": if (m.to === myId) { myRole = { qid: m.qid, x: m.x, word: m.word }; render(); } break;
    case "needrole": if (isHost && S && PLAYING.includes(S.phase) && hostQid === S.qid && S.order.includes(m.from)) sendRole(m.from); break;
    case "needboard": if (isHost && S && m.qid === S.qid) {
      for (let i = 0, n = 0; i === 0 || i < strokeLog.length; i += 25, n++) net.send({ t: "board", to: m.from, qid: S.qid, i: n, segs: strokeLog.slice(i, i + 25) });
    } break;
    case "board": if (m.to === myId && S && m.qid === S.qid) { if (m.i === 0) clearBoard(); m.segs.forEach(drawSeg); } break;
    case "draw": if (S && m.qid === S.qid) { drawSeg(m); if (isHost) logStroke(m); } break;
    case "strokeEnd":
      if (isHost && S.phase === "drawing" && m.qid === S.qid && m.turn === S.turn && m.from === S.cur) advanceTurn();
      break;
    case "vote":
      if (isHost && S.phase === "voting" && m.qid === S.qid && S.order.includes(m.from) && present[m.from] && S.order.includes(m.target) && m.target !== m.from) {
        hostVotes[m.from] = m.target; S.voted[m.from] = true; pushState();
      }
      break;
    case "liarGuess":
      if (isHost && S.phase === "guess" && m.qid === S.qid && m.from === hostLiar && !hostGuessed) {
        hostGuessed = true; S.guessText = String(m.text).slice(0, 20);
        finishRound(norm(m.text) === norm(hostWord));
      }
      break;
    case "chat": addChat(m.from, m.name, m.text); break;
    case "settings":
      if (isHost && S.phase === "lobby") {
        if (ROUND_OPTS.includes(m.totalRounds)) S.totalRounds = m.totalRounds;
        if (LAP_OPTS.includes(m.laps)) S.laps = m.laps;
        if (TURN_OPTS.includes(m.turnSec)) S.turnSec = m.turnSec;
        if (VOTE_OPTS.includes(m.voteSec)) S.voteSec = m.voteSec;
        if (Array.isArray(m.cats)) { const c = m.cats.filter((k) => CATS[k]); if (c.length) S.cats = c; }
        pushState();
      }
      break;
    case "start": if (isHost && (S.phase === "lobby" || S.phase === "gameOver")) startGame(); break;
    case "lobby": if (isHost) { S.phase = "lobby"; S.round = 0; for (const id in S.scores) S.scores[id] = 0; pushState(); } break;
  }
}
let seenQid = -1, celebratedQid = -1;
function onStateChange(prev, s) {
  if (s.phase === "result" && s.word) rememberSeen(s.word);
  if (seenQid !== s.qid && PLAYING.includes(s.phase)) {
    seenQid = s.qid; clearBoard(); myVote = null;
    sysMsg(`라운드 ${s.round} / ${s.totalRounds} 시작! 분야는 ${CATS[s.cat] ? CATS[s.cat].name : "?"}`, "info");
    if (!mySpec && !(s.order || []).includes(myId)) sysMsg("지금은 라운드가 진행 중이라 구경만 할 수 있어요. 다음 라운드부터 참가해요!", "info");
    if (s.turn > 0 || s.phase !== "drawing") net && net.send({ t: "needboard", from: myId, qid: s.qid });   // 중간에 들어온 사람은 지금까지의 그림 받기
  }
  if (s.phase === "voting" && prev && prev.phase === "drawing") sysMsg("🗳️ 그림이 끝났어요! 토론하고 라이어에게 투표해요", "info");
  if (s.phase === "guess" && prev && prev.phase !== "guess") addLine(`🕵️ 라이어는 <b>${esc(nameOf(s.liarId))}</b>님! 제시어를 맞히면 역전해요`, "info");
  if (s.phase === "result" && celebratedQid !== s.qid) {
    celebratedQid = s.qid;
    const lw = !s.caught || s.guessed;
    addLine(lw ? `🕵️ 라이어 <b>${esc(nameOf(s.liarId))}</b> 승리! 제시어는 <b>${esc(s.word || "")}</b>` : `🎉 시민 승리! 제시어는 <b>${esc(s.word || "")}</b>`, "ok");
    confetti(lw ? 60 : 140);
    for (const id in s.pts) scorePop(id, s.pts[id]);
  }
  if (s.phase === "gameOver" && (!prev || prev.phase !== "gameOver")) {
    sysMsg(s.endReason || `🏁 ${s.totalRounds}라운드 끝! 최종 순위를 확인하세요`, "info");
    if (s.round > 0) confetti(220);
  }
}

// ===================== 채팅 =====================
$("chatForm").onsubmit = (e) => {
  e.preventDefault();
  const text = $("chatInput").value.trim(); if (!text || !S) return;
  $("chatInput").value = "";
  const role = myRoleNow();
  if (role && role.word && ["drawing", "voting", "guess"].includes(S.phase) && norm(text).includes(norm(role.word))) { addLine("(제시어가 들어간 말은 보낼 수 없어요)", "sys"); return; }

  const rank = Object.keys(S.scores).filter((id) => S.names[id]).sort((a, b) => S.scores[b] - S.scores[a]);
  const pod = (i, cls, medal) => rank[i] ? `<div class="pod ${cls}">${avatar(rank[i], S.names[rank[i]])}<div class="pn">${esc(S.names[rank[i]])}</div><div class="ps">${S.scores[rank[i]]}점</div><div class="block">${medal}</div></div>` : "";
  $("resultBox").innerHTML = `<h2>🏆 최종 순위</h2><p style="color:var(--muted);margin:6px 0 0">${esc(S.endReason || `${S.totalRounds}라운드 완료!`)}</p>
    <div class="podium">${pod(1, "p2", "🥈")}${pod(0, "p1", "🥇")}${pod(2, "p3", "🥉")}</div><div class="podium-base"></div>
    ${rank.length > 3 ? `<ol class="restlist">${rank.slice(3).map((id, i) => `<li><span>${i + 4}. ${esc(S.names[id])}</span><span>${S.scores[id]}점</span></li>`).join("")}</ol>` : ""}
    <div class="choices">${isHost ? '<button id="againBtn" class="primary">🔁 한 판 더</button><button id="lobbyBtn">대기실로</button>' : '<p style="color:var(--muted)">방장이 다음 판을 정할 거예요</p>'}<button id="closeRes">결과 닫기</button></div>`;
  box.classList.remove("hidden");
  if (isHost) { $("againBtn").onclick = () => emit({ t: "start" }); $("lobbyBtn").onclick = () => emit({ t: "lobby" }); }
  $("closeRes").onclick = () => box.classList.add("hidden");
}

// 타이머 표시
setInterval(() => {
  if (!S) return;
  const leftMs = Math.max(0, localEnds - Date.now()), left = Math.ceil(leftMs / 1000);
  const show = ["drawing", "voting", "guess"].includes(S.phase);
  const tm = $("timer"); tm.classList.toggle("off", !show);
  if (show) {
    const frac = S.timerTotal ? leftMs / S.timerTotal : 0;
    $("timerNum").textContent = left;
    $("timerBar").style.strokeDashoffset = String(213.6 * (1 - frac));
    tm.classList.toggle("mid", frac <= .5 && left > 5);
    tm.classList.toggle("low", left <= 5);
    tm.classList.toggle("crit", left <= 3);
  }
}, 200);
</script>
</body>
</html>
